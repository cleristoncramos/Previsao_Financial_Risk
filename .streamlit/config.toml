# Tema visual do painel: claro, sóbrio e sem cantos arredondados
[theme]
base = "light"
primaryColor = "#1e3a8a"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2937"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap, monospace"
baseRadius = "none"
buttonRadius = "none"
borderColor = "#3f4654"
dataframeBorderColor = "#d4d7dd"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
